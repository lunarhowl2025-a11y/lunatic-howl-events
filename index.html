<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Howl | The Inferno Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial Black', Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            text-align: center;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #2a0000 0%, #000 100%);
            padding: 2rem;
        }
        .logo {
            width: 300px;
            height: 300px;
            margin-bottom: 2rem;
            border-radius: 50%;
            border: 3px solid #ff0000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #ff0000;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }
        .event-box {
            background: linear-gradient(135deg, #1a0000 0%, #000 100%);
            border: 2px solid #ff0000;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255,0,0,0.3);
        }
        .event-date {
            font-size: 4rem;
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .event-name {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .event-location {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .event-time {
            color: #ff0000;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 3rem;
            background: #ff0000;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .contact {
            margin-top: 3rem;
            color: #666;
        }
        .contact a {
            color: #ff0000;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .logo { width: 200px; height: 200px; }
            h1 { font-size: 2rem; }
            .event-date { font-size: 2.5rem; }
            .event-name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo">
            <img src="IMG_6358.PNG" alt="Lunar Howl Logo">
        </div>
        
        <h1>LUNAR HOWL</h1>
        <p class="subtitle">Underground Techno Collective</p>
        
        <div class="event-box">
            <div class="event-date">21 MARCH 2026</div>
            <div class="event-name">THE INFERNO ROOM</div>
            <div class="event-location">RUMBA</div>
            <div class="event-time">DOORS 22:00 - 06:00</div>
            
            <a href="mailto:lunar.howl2025@gmail.com" class="btn">GET TICKETS</a>
        </div>
        
        <div class="contact">
            <p>Contact: <a href="mailto:lunar.howl2025@gmail.com">lunar.howl2025@gmail.com</a></p>
            <p style="margin-top: 0.5rem;">Tel: 0456/90.18.90</p>
        </div>
    </div>

</body>
</html>
